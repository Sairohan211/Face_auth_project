[phases.setup]
nixPkgs = [
  "python310",
  "gcc",
  "stdenv.cc.cc.lib",
  "libGL",
  "libGLU",
  "glib",
  "xorg.libxcb",
  "xorg.libX11",
  "xorg.libXext",
  "xorg.libXrender",
  "xorg.libSM",
  "xorg.libICE"
]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install -r requirements.txt",
  "pip install --force-reinstall --no-deps opencv-python-headless",
  "python -c \"from insightface.app import FaceAnalysis; FaceAnalysis(name='buffalo_sc', root='./.insightface')\""
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
